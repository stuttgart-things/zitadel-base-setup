name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - run: tofu fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [modules/org-users, modules/oidc-project, examples/lab]
        # 1.11.0 is the floor org-users declares; latest catches new breakage.
        tofu: [1.11.0, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tofu }}
      - run: tofu init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: tofu validate
        working-directory: ${{ matrix.dir }}
